
# ============================================================
# PICOM v13 — Quadro M2200 / Nvidia 570 / Dual 4K
# ============================================================
# Цвета нейтральные — будут заменены Aether-шаблоном во второй волне.
# ============================================================

# --- Backend & Performance ---
backend = "glx";
vsync = true;
xrender-sync-fence = true;
use-damage = true;
dithered-present = true;

# --- Shadows ---
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.55;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";

# --- Fading ---
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;
no-fading-openclose = false;

# --- Rounded Corners ---
corner-radius = 12;

# --- Blur ---
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

# --- General ---
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;
unredir-if-possible = false;

# --- Animations (picom v12+) ---
animations = true;
animation-for-open-window = "zoom";
animation-for-close-window = "zoom";
animation-for-unmap-window = "slide-down";
animation-for-workspace-switch-in = "slide-up";
animation-for-workspace-switch-out = "slide-down";
animation-stiffness = 200;
animation-dampening = 25;
animation-clamping = true;
animation-mass = 1;

# --- Window Rules (v13 unified) ---
rules = (
  # WM окна и override-redirect — считать focused
  {
    match = "window_type = 'dock' || window_type = 'toolbar' || window_type = 'desktop'";
    shadow = false;
    blur-background = false;
    corner-radius = 0;
    fade = false;
    animations = false;
    focused = true;
  },
  # Drag-and-drop
  {
    match = "window_type = 'dnd'";
    shadow = false;
    animations = false;
  },
  # Tooltips
  {
    match = "window_type = 'tooltip'";
    shadow = false;
    opacity = 0.90;
    fade = false;
    animations = false;
  },
  # Popup и dropdown menus
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu'";
    shadow = false;
    opacity = 0.95;
    fade = false;
    animations = false;
  },
  # Override-redirect (всплывающие элементы, автокомплиты)
  {
    match = "override_redirect = true";
    shadow = false;
    fade = false;
    animations = false;
    focused = true;
  },
  # Conky
  {
    match = "class_g = 'Conky'";
    shadow = false;
    blur-background = false;
  },
  # Fullscreen — чистый рендер, никаких эффектов поверх
  {
    match = "fullscreen";
    shadow = false;
    corner-radius = 0;
    blur-background = false;
    opacity = 1.0;
  },
  # Alacritty — полупрозрачный, blur делает его читаемым
  {
    match = "class_g = 'Alacritty'";
    opacity = 0.88;
  },
  # Rofi
  {
    match = "class_g = 'Rofi'";
    opacity = 0.92;
  },
  # Dunst
  {
    match = "class_g = 'Dunst'";
    opacity = 0.92;
  },
  # Браузер, видеоплееры — непрозрачные, без blur за окном
  {
    match = "class_g = 'Google-chrome' || class_g = 'firefox' || class_g = 'mpv' || class_g = 'vlc'";
    opacity = 1.0;
    blur-background = false;
  },
);
