##### BASICS ############################################################
set -g default-terminal "tmux-256color"          # 1  TERM
set -ga terminal-overrides ',*:Tc:sitm=\E[3m'    # 5  true-color + курсив
set -g mouse on                                  # 2  единожды
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g set-clipboard on                          # 11 OSC52 fallback по SSH

##### PREFIX ############################################################
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind C-b send-prefix                             # 4  fallback

##### NAVIGATION ########################################################
# стрелки с префиксом
unbind -n Up
unbind -n Down
unbind -n Left
unbind -n Right

bind Up    select-pane -U
bind Down  select-pane -D
bind Left  select-pane -L
bind Right select-pane -R
# vim-стайл
is_vim="ps -o comm= -t '#{pane_tty}' | grep -qiE '(^|/)g?(view|n?vim)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"   # 3
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

##### SPLITS + RESIZE ###################################################
bind - split-window -v
bind = split-window -h
unbind '"' ; unbind %
# resize на hjkl (+Shift для ×5)
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r C-Up    resize-pane -U
bind -r C-Down  resize-pane -D
bind -r C-Left  resize-pane -L
bind -r C-Right resize-pane -R

##### WINDOWS / PANES / SESSIONS ########################################
bind c new-window
bind n next-window
bind p previous-window
bind l last-window
bind & kill-window
bind , command-prompt "rename-window '%%'"
bind w choose-window
bind C new-session
bind '$' command-prompt "rename-session '%%'"
bind s choose-session
bind d detach-client
bind o select-pane -t :.+
bind q display-panes
bind x kill-pane
bind z resize-pane -Z
bind Space next-layout

##### COPY / PASTE (просто) #############################################
# 11  Три сценария:
#  a) v / y в copy-mode → системный clipboard (tmux-yank)
#  b) выделил мышью в любом GUI → MiddleClick в nvim/tmux/браузере, как обычно
#  c) ssh-сессии → OSC52 копирует в локальный буфер терминала
setw -g mode-keys vi
# bind -T copy-mode-vi v send -X begin-selection
# bind -T copy-mode-vi y send -X copy-selection-and-cancel
# —————  Middle-click → вставить X PRIMARY  —————
unbind -T root MouseDown2Pane
bind   -T root MouseDown2Pane run-shell -b \
  "tmux load-buffer - < <(xclip -o -selection primary) ; tmux paste-buffer -d"

##### MOUSE DRAG COPY ###################################################
# При отпускании ЛКМ отправить выделение сразу в оба X-буфера
  unbind -T copy-mode-vi  MouseDragEnd1Pane
  unbind -T copy-mode     MouseDragEnd1Pane

  bind -T copy-mode-vi  MouseDragEnd1Pane \
    send -X copy-pipe-and-cancel "xclip -i -selection clipboard -f \
    | xclip -i -selection primary"

    bind -T copy-mode     MouseDragEnd1Pane \
      send -X copy-pipe-and-cancel "xclip -i -selection clipboard -f \
      | xclip -i -selection primary"

##### STATUS-LINE (минимальный) #########################################
set -g status-interval 5
set -g status-left  "#[fg=colour47]🔋#(acpi | cut -d','  -f2-2)"
set -g status-right "#[fg=colour28]%Y-%m-%d %H:%M #[default]"
set -g window-style "bg=default"
set -g window-active-style 'bg=default'

##### TPM + PLUGINS #####################################################
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/dotfiles/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-yank'          # 7 + 11
set -g @plugin 'tmux-plugins/tmux-open'          # 7  URL-open
set -g @plugin 'erikw/tmux-power'

# tmux-yank конфиг: xclip, два буфера
# set -g @yank_selection 'clipboard'
# set -g @clipboard "xclip -selection clipboard -in"

# Автосохранение сессий
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

run '~/.tmux/plugins/tpm/tpm'                    # оставить последним

