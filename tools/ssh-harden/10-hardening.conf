# Drop-in для /etc/ssh/sshd_config.d/10-hardening.conf
# Мандат ЦУ ic-ssh-harden (2026-11-06): вход только по ключу, корень-off.
# Предусловие проверено: ~/.ssh/authorized_keys содержит рабочий ключ (1 ключ,
# создан 06.11 16:24) — перевод на ключ-only не запирает доступ.
#
# KbdInteractiveAuthentication явно: в 99-archlinux.conf он уже no, здесь —
# страховка от дрейфа (банка Arch меняет drop-ины при обновлениях пакета).

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
MaxAuthTries 3
