[Unit]
# Qtile не активирует graphical-session.target (RefuseManualStart=yes).
# Убираем Requisite=, чтобы portal мог стартовать независимо.
# Portal работает через dbus-активацию — ему не нужен graphical-session.target.
Requisite=

# After= тоже убираем — target не активен, ordering не имеет смысла
After=
